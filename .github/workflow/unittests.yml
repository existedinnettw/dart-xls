name: unit_tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Install dependencies for libxls build
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libzip-dev
          sudo apt-get install -y autoconf-archive

      - name: Build libxls submodule
        working-directory: libxls
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)

      - name: Install Dart dependencies
        run: dart pub get

      - name: Static analysis (save output)
        run: dart analyze > dart_analyze.txt || true

      - name: Dart Analyze to SARIF
        uses: advanced-security/dart-analyzer-sarif@main
        with:
          input: dart_analyze.txt
          output: dart_analyze.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dart_analyze.sarif

      - name: Run tests
        run: dart test --chain-stack-traces
