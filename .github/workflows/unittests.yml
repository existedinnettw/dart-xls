name: unit_tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  linux:
    name: Linux Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc] #, gcc-9, gcc-10, gcc-11, gcc-12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Add Ubuntu toolchain PPA and install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo apt-add-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gettext autoconf automake libtool libtool-bin pkg-config libzip-dev autoconf-archive ${{ matrix.compiler }}

      - name: Build libxls
        working-directory: libxls
        run: |
          ./autogen.sh
          ./configure CC=${{ matrix.compiler }}
          make -j$(nproc || sysctl -n hw.ncpu || echo 2)

      - name: Run libxls tests
        working-directory: libxls
        run: |
          make check
          ./test2_libxls test/files/test2.xls

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run Dart analyze with annotations
        uses: invertase/github-action-dart-analyzer@v3

      - name: Run Dart tests
        run: dart test --chain-stack-traces

  macos:
    name: macOS Build & Test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install brew dependencies
        run: |
          brew update
          brew install automake autoconf libtool pkg-config libzip gettext libiconv autoconf-archive
          brew link --force gettext || true
          brew link --force libiconv || true

      - name: Build libxls
        working-directory: libxls
        run: |
          export ACLOCAL_PATH="$(brew --prefix libiconv)/share/aclocal:$(brew --prefix gettext)/share/aclocal:$(brew --prefix autoconf-archive)/share/aclocal:$ACLOCAL_PATH"
          ./autogen.sh
          ./configure CC=${{ matrix.compiler }}
          make -j$(sysctl -n hw.ncpu)

      - name: Run libxls tests
        working-directory: libxls
        run: |
          make check
          ./test2_libxls test/files/test2.xls

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run Dart tests
        run: dart test --chain-stack-traces

  windows:
    name: Windows Build & Test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: |
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libiconv
            automake
            autoconf
            libtool
            pkg-config
            autoconf-archive

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build libxls
        working-directory: libxls
        run: |
          autoreconf -i -f
          ./configure
          make -j$(nproc || echo 2)

      - name: Run libxls tests
        working-directory: libxls
        run: |
          make check
          ./test2_libxls test/files/test2.xls

      - name: Install Dart dependencies
        run: dart pub get

      - name: Run Dart tests
        run: dart test --chain-stack-traces

