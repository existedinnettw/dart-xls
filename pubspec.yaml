name: dart_xls
description: Dart bindings for libxls (XLS binary Excel parser) via dart:ffi.
publish_to: none
version: 0.1.0
environment:
  sdk: '>=2.18.0 <4.0.0'
dependencies:
  ffi: ^2.0.1
  path: ^1.8.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.27.0

flutter:
  plugin:
    platforms:
      android:
        package: dart_xls
        pluginClass: DartXlsPlugin
      ios:
        pluginClass: DartXlsPlugin
